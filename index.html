<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz das Bandeiras</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #333; margin-bottom: 20px; }
        .info { margin: 15px 0; font-size: 18px; }
        .timer { 
            font-size: 24px; 
            color: #e74c3c; 
            font-weight: bold;
            margin: 10px 0;
        }
        .bandeira { font-size: 100px; margin: 20px 0; }
        .opcoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #5568d3; transform: scale(1.05); }
        .btn-pular { background: #95a5a6; grid-column: span 2; }
        .btn-pular:hover { background: #7f8c8d; }
        .btn-iniciar { background: #2ecc71; font-size: 20px; padding: 15px; }
        .btn-iniciar:hover { background: #27ae60; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        .ranking {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        table { width: 100%; margin-top: 10px; }
        th, td { padding: 8px; text-align: left; }
        th { background: #667eea; color: white; }
        tr:nth-child(even) { background: #f2f2f2; }
        .tela { display: none; }
        .tela.ativa { display: block; }
        .correct { background: #2ecc71 !important; }
        .wrong { background: #e74c3c !important; }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏁 Quiz das Bandeiras</h1>
        
        <div id="telaInicio" class="tela ativa">
            <h2>Digite seu nome</h2>
            <input type="text" id="nomeJogador" placeholder="Seu nome" maxlength="20">
            <button class="btn-iniciar" onclick="iniciarJogo()">Começar Quiz</button>
        </div>

        <div id="telaJogo" class="tela">
            <div class="info">Jogador: <span id="nomeExibido"></span></div>
            <div class="info">Vidas: <span id="vidas">❤️❤️❤️</span></div>
            <div class="info">Pontos: <span id="pontos">0</span>/10</div>
            <div class="timer" id="timer">⏱️ 10s</div>
            <div class="bandeira" id="bandeira">🏳️</div>
            <div class="opcoes" id="opcoes"></div>
            <button class="btn-pular" onclick="pular()">Pular -1 vida</button>
        </div>

        <div id="telaGameOver" class="tela">
            <h2>💀 Game Over!</h2>
            <p><span id="nomeFinal"></span></p>
            <p>Sua pontuação: <span id="pontosFinal">0</span>/10</p>
            <p id="msgSalvando">Salvando...</p>
        </div>

        <div class="ranking">
            <input type="password" id="senha" placeholder="Senha do admin">
            <button onclick="mostrarRanking()">Ver Ranking</button>
            <div id="tabelaRanking" style="display:none;">
                <h3>🏆 Top 10</h3>
                <table id="rankingTable">
                    <tr><th>#</th><th>Nome</th><th>Pontos</th></tr>
                </table>
            </div>
        </div>
    </div>

    <audio id="somDerrota">
        <source src="https://www.myinstants.com/media/sounds/sad-violin.mp3" type="audio/mpeg">
    </audio>

    <script>
        const PAIS_BANDEIRAS = [
            {pais: "Bahamas", bandeira: "🇧🇸"},
            {pais: "Iêmen", bandeira: "🇾🇪"},
            {pais: "Moldávia", bandeira: "🇲🇩"},
            {pais: "Eritreia", bandeira: "🇪🇷"},
            {pais: "Azerbaijão", bandeira: "🇦🇿"},
            {pais: "Tuvalu", bandeira: "🇹🇻"},
            {pais: "Nauru", bandeira: "🇳🇷"},
            {pais: "Vanuatu", bandeira: "🇻🇺"},
            {pais: "Burundi", bandeira: "🇧🇮"},
            {pais: "Tonga", bandeira: "🇹🇴"}
        ];

        let vidas = 3;
        let pontos = 0;
        let paisAtual = {};
        let paisesDisponiveis = [];
        let tempo = 10;
        let timerInterval;
        let nomeJogador = "";
        const SENHA_ADMIN = "bandeira123";
        const BIN_ID = "68f27a8d43b1c97be9799d2a";
        const API_KEY = "$2a$10$RqF8X8X8XeX8X8X8X8X8";

        function iniciarJogo() {
            nomeJogador = document.getElementById('nomeJogador').value.trim();
            if (!nomeJogador) return alert('Digite seu nome!');
            
            vidas = 3;
            pontos = 0;
            paisesDisponiveis = [...PAIS_BANDEIRAS];
            
            document.getElementById('nomeExibido').textContent = nomeJogador;
            document.getElementById('telaInicio').classList.remove('ativa');
            document.getElementById('telaJogo').classList.add('ativa');
            
            atualizarTela();
            novaRodada();
        }

        function iniciarTimer() {
            tempo = 10;
            document.getElementById('timer').textContent = `⏱️ ${tempo}s`;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                tempo--;
                document.getElementById('timer').textContent = `⏱️ ${tempo}s`;
                if (tempo <= 0) {
                    clearInterval(timerInterval);
                    tempoEsgotado();
                }
            }, 1000);
        }

        function tempoEsgotado() {
            const botoes = document.querySelectorAll('.opcoes button');
            botoes.forEach(b => b.disabled = true);
            vidas--;
            if (vidas <= 0) {
                gameOver();
            } else {
                atualizarTela();
                setTimeout(novaRodada, 1000);
            }
        }

        function novaRodada() {
            if (paisesDisponiveis.length === 0 || vidas <= 0) {
                gameOver();
                return;
            }
            
            const index = Math.floor(Math.random() * paisesDisponiveis.length);
            paisAtual = paisesDisponiveis.splice(index, 1)[0];
            
            document.getElementById('bandeira').textContent = paisAtual.bandeira;
            
            let opcoes = [paisAtual.pais];
            let paisesErrados = PAIS_BANDEIRAS.filter(p => p.pais !== paisAtual.pais);
            paisesErrados = paisesErrados.sort(() => 0.5 - Math.random()).slice(0, 3);
            opcoes = [...opcoes, ...paisesErrados.map(p => p.pais)];
            opcoes = opcoes.sort(() => 0.5 - Math.random());
            
            const opcoesDiv = document.getElementById('opcoes');
            opcoesDiv.innerHTML = '';
            opcoes.forEach(opcao => {
                const btn = document.createElement('button');
                btn.textContent = opcao;
                btn.onclick = () => verificarResposta(opcao, btn);
                opcoesDiv.appendChild(btn);
            });
            
            iniciarTimer();
        }

        function verificarResposta(resposta, botao) {
            clearInterval(timerInterval);
            const botoes = document.querySelectorAll('.opcoes button');
            botoes.forEach(b => b.disabled = true);
            
            if (resposta === paisAtual.pais) {
                pontos += 1;
                botao.classList.add('correct');
                setTimeout(() => {
                    atualizarTela();
                    novaRodada();
                }, 800);
            } else {
                vidas--;
                botao.classList.add('wrong');
                botoes.forEach(b => {
                    if (b.textContent === paisAtual.pais) b.classList.add('correct');
                });
                setTimeout(() => {
                    if (vidas <= 0) {
                        gameOver();
                    } else {
                        atualizarTela();
                        novaRodada();
                    }
                }, 1500);
            }
        }

        function pular() {
            clearInterval(timerInterval);
            vidas--;
            if (vidas <= 0) {
                gameOver();
            } else {
                atualizarTela();
                novaRodada();
            }
        }

        function atualizarTela() {
            document.getElementById('vidas').textContent = '❤️'.repeat(vidas);
            document.getElementById('pontos').textContent = pontos;
        }

        async function gameOver() {
            clearInterval(timerInterval);
            
            // TOCA A MÚSICA TRISTE KKKK
            document.getElementById('somDerrota').play().catch(e => console.log('Audio bloqueado'));
            
            document.getElementById('telaJogo').classList.remove('ativa');
            document.getElementById('telaGameOver').classList.add('ativa');
            document.getElementById('nomeFinal').textContent = nomeJogador;
            document.getElementById('pontosFinal').textContent = pontos;
            
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const ranking = data.record.ranking || [];
                
                ranking.push({ nome: nomeJogador, pontos, data: new Date().toLocaleDateString('pt-BR') });
                ranking.sort((a, b) => b.pontos - a.pontos);
                const top10 = ranking.slice(0, 10);
                
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ ranking: top10 })
                });
                
                document.getElementById('msgSalvando').textContent = '✅ Pontuação salva! Recarregue para jogar novamente.';
            } catch (e) {
                document.getElementById('msgSalvando').textContent = '❌ Erro ao salvar pontuação';
            }
        }

        async function mostrarRanking() {
            const senha = document.getElementById('senha').value;
            if (senha !== SENHA_ADMIN) return alert('Senha incorreta!');
            
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                const data = await res.json();
                const ranking = data.record.ranking || [];
                
                const tbody = document.getElementById('rankingTable');
                tbody.innerHTML = '<tr><th>#</th><th>Nome</th><th>Pontos</th></tr>';
                ranking.forEach((j, i) => {
                    tbody.innerHTML += `<tr><td>${i+1}º</td><td>${j.nome}</td><td>${j.pontos}</td></tr>`;
                });
                
                document.getElementById('tabelaRanking').style.display = 'block';
            } catch (e) {
                alert('Erro ao carregar ranking');
            }
        }
    </script>
</body>
</html>
